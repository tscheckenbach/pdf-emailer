{{define "content"}}
<div class="px-4 py-6 sm:px-0">
    <div class="text-center">
        <h1 class="text-4xl font-bold text-gray-900 mb-4">{{.Title}}</h1>
        <p class="text-xl text-gray-600 mb-8">{{.Description}}</p>
        
        <div class="max-w-3xl mx-auto">
            <div class="bg-white shadow rounded-lg p-6 mb-6">
                <h2 class="text-2xl font-semibold text-gray-900 mb-6">Upload PDF Files</h2>
                
                <form id="uploadForm" class="space-y-6">
                    <!-- Template Selection -->
                    <div>
                        <label for="template" class="block text-sm font-medium text-gray-700 mb-2">Select Template</label>
                        <select id="template" name="template" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                            <option value="">Choose a template...</option>
                            <option value="template1">Template 1</option>
                            <option value="template2">Template 2</option>
                            <option value="template3">Template 3</option>
                        </select>
                    </div>

                    <!-- File Upload Area -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Upload Files</label>
                        <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-lg p-8 text-center hover:border-blue-400 transition-colors duration-200">
                            <div class="space-y-4">
                                <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48">
                                    <path d="M28 8H12a4 4 0 00-4 4v20m32-12v8m0 0v8a4 4 0 01-4 4H12a4 4 0 01-4-4v-4m32-4l-3.172-3.172a4 4 0 00-5.656 0L28 28M8 32l9.172-9.172a4 4 0 015.656 0L28 28m0 0l4 4m4-24h8m-4-4v8m-12 4h.02" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                                </svg>
                                <div>
                                    <p class="text-lg font-medium text-gray-900">Drag and drop files here</p>
                                    <p class="text-sm text-gray-500">or click to browse</p>
                                </div>
                                <input type="file" id="fileInput" multiple accept=".pdf" class="hidden">
                            </div>
                        </div>
                    </div>


                    <!-- Upload Button -->
                    <div class="flex justify-center">
                        <button type="submit" id="uploadBtn" class="inline-flex items-center px-6 py-3 border border-transparent text-base font-medium rounded-md shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                            </svg>
                            Upload Files
                        </button>
                    </div>
                    
                    <!-- Upload Progress -->
                    <div id="uploadProgress" class="hidden">
                        <div class="space-y-2">
                            <div class="flex justify-between text-sm text-gray-600">
                                <span>Uploading files...</span>
                                <span id="progressText">0%</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div id="progressBar" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- File List -->
                    <div id="fileList" class="space-y-2 hidden">
                        <h3 class="text-sm font-medium text-gray-700">Selected Files:</h3>
                        <div id="fileItems" class="space-y-2"></div>
                    </div>

                </form>
            </div>
            
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const fileList = document.getElementById('fileList');
    const fileItems = document.getElementById('fileItems');
    const uploadForm = document.getElementById('uploadForm');
    const uploadBtn = document.getElementById('uploadBtn');
    const uploadProgress = document.getElementById('uploadProgress');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    
    let selectedFiles = [];

    // Drag and drop functionality
    dropZone.addEventListener('dragover', function(e) {
        e.preventDefault();
        dropZone.classList.add('border-blue-400', 'bg-blue-50');
    });

    dropZone.addEventListener('dragleave', function(e) {
        e.preventDefault();
        dropZone.classList.remove('border-blue-400', 'bg-blue-50');
    });

    dropZone.addEventListener('drop', function(e) {
        e.preventDefault();
        dropZone.classList.remove('border-blue-400', 'bg-blue-50');
        
        const files = Array.from(e.dataTransfer.files).filter(file => file.type === 'application/pdf');
        addFiles(files);
    });

    dropZone.addEventListener('click', function() {
        fileInput.click();
    });

    fileInput.addEventListener('change', function(e) {
        const files = Array.from(e.target.files);
        addFiles(files);
    });

    function addFiles(files) {
        files.forEach(file => {
            if (file.type === 'application/pdf' && !selectedFiles.find(f => f.name === file.name)) {
                selectedFiles.push(file);
            }
        });
        updateFileList();
    }

    function updateFileList() {
        if (selectedFiles.length > 0) {
            fileList.classList.remove('hidden');
            fileItems.innerHTML = '';
            
            selectedFiles.forEach((file, index) => {
                const fileItem = document.createElement('div');
                fileItem.className = 'flex items-center justify-between p-3 bg-gray-50 rounded-lg';
                fileItem.innerHTML = `
                    <div class="flex items-center space-x-3">
                        <svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2H4zm0 2h12v8H4V6z" clip-rule="evenodd"></path>
                        </svg>
                        <span class="text-sm font-medium text-gray-900">${file.name}</span>
                        <span class="text-xs text-gray-500">(${(file.size / 1024 / 1024).toFixed(2)} MB)</span>
                    </div>
                    <button type="button" onclick="removeFile(${index})" class="text-red-500 hover:text-red-700">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                `;
                fileItems.appendChild(fileItem);
            });
        } else {
            fileList.classList.add('hidden');
        }
    }

    window.removeFile = function(index) {
        selectedFiles.splice(index, 1);
        updateFileList();
    };

    // Form submission
    uploadForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const template = document.getElementById('template').value;
        if (!template) {
            alert('Es muss ein Template ausgewählt werden');
            return;
        }
        
        if (selectedFiles.length === 0) {
            alert('Es müssen PDF-Dateien hinzugefügt werden');
            return;
        }

        uploadBtn.disabled = true;
        uploadProgress.classList.remove('hidden');
        
        let completedUploads = 0;
        const totalFiles = selectedFiles.length;
        
        for (let i = 0; i < selectedFiles.length; i++) {
            const file = selectedFiles[i];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('template', template);
            
            try {
                const response = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                
                if (response.ok) {
                    console.log(`File ${file.name} uploaded successfully`);
                } else {
                    console.error(`Error uploading ${file.name}:`, await response.text());
                }
            } catch (error) {
                console.error(`Error uploading ${file.name}:`, error);
            }
            
            completedUploads++;
            const progress = Math.round((completedUploads / totalFiles) * 100);
            progressBar.style.width = progress + '%';
            progressText.textContent = progress + '%';
        }
        
        // Reset form after upload
        setTimeout(() => {
            selectedFiles = [];
            updateFileList();
            uploadForm.reset();
            uploadBtn.disabled = false;
            uploadProgress.classList.add('hidden');
            progressBar.style.width = '0%';
            progressText.textContent = '0%';
            alert('Upload completed!');
        }, 1000);
    });
});
</script>
{{end}}
