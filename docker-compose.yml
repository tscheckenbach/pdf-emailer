services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - mailpit
    env_file:
      - .env.docker
    volumes:
      - ./assets:/app/assets
      - ./uploads:/app/uploads
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP server
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    restart: unless-stopped 