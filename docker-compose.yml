services:
  app:
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - db
      - mailpit
    env_file:
      - .env.docker
    volumes:
      - ./assets:/app/assets
      - ./uploads:/app/uploads
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    env_file:
      - .env.docker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/database
      - ./_data/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP server
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    restart: unless-stopped

volumes:
  postgres_data: 