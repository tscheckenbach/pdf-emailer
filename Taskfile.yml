version: '3'

vars:
  PATH_PREFIX: /opt/homebrew/bin
  IMAGE: registry.creativation.de/pdf-emailer
  VERSION:
    sh: tr -d '[:space:]' < VERSION
  TAG: '{{.TAG | default .VERSION}}'
  PLATFORM: '{{.PLATFORM | default "linux/amd64"}}'

env:
  PATH: "{{.PATH_PREFIX}}:{{.PATH}}"

tasks:
  default:
    desc: Show available commands
    cmds:
      - task --list

  build:
    desc: Build the application
    cmds:
      - go build -o bin/pdf-emailer main.go

  run:
    desc: Run the application (starts Mailpit dependency first)
    cmds:
      - echo "Starting Mailpit..."
      - docker compose stop && docker compose up mailpit -d
      - go run main.go

  up:
    desc: Run full stack (app + Mailpit) via Docker Compose
    cmds:
      - docker compose up --build

  dev:
    desc: Run with Air (auto-reload on file changes)
    cmds:
      - echo "Starting Mailpit..."
      - docker compose stop && docker compose up mailpit -d
      - echo "Starting Air development server..."
      - air

  test:
    desc: Run tests
    cmds:
      - go test -v ./...

  test-coverage:
    desc: Run tests with coverage
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated coverage.html"

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf bin/
      - rm -f coverage.out coverage.html

  deps:
    desc: Download dependencies
    cmds:
      - go mod download
      - go mod tidy

  lint:
    desc: Run linter
    cmds:
      - golangci-lint run

  install-tools:
    desc: Install development tools
    cmds:
      - go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
      - go install github.com/air-verse/air@latest

  mjml:
    desc: Convert MJML templates to HTML
    dir: assets/templates/email
    cmds:
      - echo "Converting MJML templates to HTML..."
      - |
        for file in *.mjml; do
          if command -v mjml >/dev/null 2>&1; then
            echo "Converting $file..."
            mjml "$file" -o "${file%.mjml}.html"
          else
            echo "MJML CLI not found. Please install with: npm install -g mjml"
            exit 1
          fi
        done
      - echo "MJML conversion complete!"

  setup-env:
    desc: Set up environment files
    cmds:
      - chmod +x scripts/setup-env.sh
      - ./scripts/setup-env.sh

  dev-setup:
    desc: Development environment setup
    deps: [deps, install-tools]
    cmds:
      - echo "Development environment setup complete!"
      - echo "Next steps:"
      - echo "1. Copy env.example to .env and configure your settings"
      - echo "2. Run 'task run' to start the application"

  version:
    desc: Show the local release version
    cmds:
      - printf '%s\n' '{{.VERSION}}'

  version:bump:
    desc: Bump VERSION with PART=major|minor|hotfix
    vars:
      PART: '{{.PART | default "hotfix"}}'
    cmds:
      - scripts/bump-version.sh {{.PART}}

  version:major:
    desc: Bump VERSION major number
    cmds:
      - task version:bump PART=major

  version:minor:
    desc: Bump VERSION minor number
    cmds:
      - task version:bump PART=minor

  version:hotfix:
    desc: Bump VERSION hotfix number
    cmds:
      - task version:bump PART=hotfix

  docker-build:
    desc: Build the Docker image
    cmds:
      - docker build --platform {{.PLATFORM}} -t {{.IMAGE}}:{{.TAG}} .

  docker-push:
    desc: Build and push the Docker image
    cmds:
      - docker build --platform {{.PLATFORM}} -t {{.IMAGE}}:{{.TAG}} .
      - docker push {{.IMAGE}}:{{.TAG}}

  docker-release:
    desc: Build once, tag as TAG and latest, and push both tags
    requires:
      vars: [TAG]
    cmds:
      - docker build --platform {{.PLATFORM}} -t {{.IMAGE}}:{{.TAG}} -t {{.IMAGE}}:latest .
      - docker push {{.IMAGE}}:{{.TAG}}
      - docker push {{.IMAGE}}:latest

  release:major:
    desc: Bump major version, build once, tag as VERSION and latest, and push both tags
    cmds:
      - task version:major
      - task docker-release TAG=$(tr -d '[:space:]' < VERSION)
      - task version

  release:minor:
    desc: Bump minor version, build once, tag as VERSION and latest, and push both tags
    cmds:
      - task version:minor
      - task docker-release TAG=$(tr -d '[:space:]' < VERSION)
      - task version

  release:hotfix:
    desc: Bump hotfix version, build once, tag as VERSION and latest, and push both tags
    cmds:
      - task version:hotfix
      - task docker-release TAG=$(tr -d '[:space:]' < VERSION)
      - task version
